<!DOCTYPE html>
<html>

<head>

    <title>E-Commerce Store</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
            width: 250px;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>🛒 My Store</h1>

    <div class="products"></div>

    <script>

        function addToCart() {
            alert("Product Added To Cart!");
        }

        fetch("http://localhost:5500/products")

            .then(response => response.json())

            .then(data => {

                data.forEach(product => {

                    document.querySelector(".products").innerHTML += `

                <div class="card">

                    <img src="${product.image}" width="200">

                    <h2>${product.name}</h2>

                    <p>₹${product.price}</p>

                    <button onclick="addToCart()">
                        Add To Cart
                    </button>

                </div>

                `;

                });

            });

    </script>

</body>

</html>
